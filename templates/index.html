<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        input, textarea { width: 100%; padding: 8px; margin: 8px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #45a049; }
        .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .danger  { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        a { display: block; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>Student Registration Form</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form action="/register" method="POST">
        <label>Name:</label>
        <input type="text" name="name" placeholder="Full Name" required>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Email Address" required>

        <label>Phone:</label>
        <input type="text" name="phone" placeholder="Phone Number" required>

        <label>Course:</label>
        <input type="text" name="course" placeholder="Course Name" required>

        <label>Address:</label>
        <textarea name="address" placeholder="Address" rows="3" required></textarea>

        <label>Contact:</label>
        <input type="text" name="contact" placeholder="Emergency Contact">

        <button type="submit">Register</button>
    </form>

    <a href="/students">View All Students</a>
</body>
</html>
